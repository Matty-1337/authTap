# CI: lint + production build | Deploy: VPS pulls origin/main, then Docker
#
# Secrets (repository Settings > Secrets and variables > Actions):
#   VPS_HOST        - 217.216.83.140
#   VPS_USER        - root
#   VPS_SSH_KEY     - same private key as the other TAP repos (github-actions-dk-deploy)
#   VPS_DEPLOY_PATH - /var/www/authtap
#
# The VPS clone must already track origin/main. Actions never copies files;
# it only SSHes in and runs git fetch/reset + docker compose.

name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          timeout: 60s
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            echo "==> syncing to origin/main"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "==> building authtap"
            docker compose -f docker-compose.yml build authtap
            echo "==> starting authtap"
            docker compose -f docker-compose.yml up -d --remove-orphans authtap
            echo "==> waiting for http://127.0.0.1:3004"
            ok=0
            for _ in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3004 >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1
            echo "==> deploy done"
            docker compose -f docker-compose.yml ps
