# /etc/nginx/sites-available/authtap
# Cloudflare can terminate TLS; origin stays on :80 until certbot runs.

server {
    listen 80;
    server_name authtap.deltakinetics.io;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Next standalone can emit the Docker bind address in Location.
        proxy_redirect http://0.0.0.0:3000/ https://authtap.deltakinetics.io/;
        proxy_redirect https://0.0.0.0:3000/ https://authtap.deltakinetics.io/;
        proxy_redirect http://0.0.0.0:3004/ https://authtap.deltakinetics.io/;
        proxy_redirect https://0.0.0.0:3004/ https://authtap.deltakinetics.io/;
    }
}
